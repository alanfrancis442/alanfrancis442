name: pixel-world

on:
  schedule:
    - cron: "41 18 * * *"   # every night, ~00:11 IST
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["generate.py", "pixel/**", "intro.txt"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Draw town + party
        env:
          # Optional: add a PIXEL_TOKEN secret (classic PAT, read:user + repo)
          # to include private contributions and private-repo languages.
          GH_TOKEN: ${{ secrets.PIXEL_TOKEN || secrets.GITHUB_TOKEN }}
          EXCLUDE_LANGS: ""
        run: python generate.py --user ${{ github.repository_owner }} --out dist

      # Images go to a separate "output" branch that is overwritten every run,
      # so the main branch history doesn't fill up with daily GIFs.
      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name  "pixel-world-bot"
          git config user.email "pixel-world-bot@users.noreply.github.com"
          git add .
          git commit -qm "draw $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
